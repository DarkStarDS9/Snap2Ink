name: Snap2Ink

options:
  bundleIdPrefix: app.snap2ink
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

# Project-wide build settings live here, not in the Xcode GUI — xcodegen regenerates the
# .xcodeproj on every run and would discard GUI edits.
settings:
  base:
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_VERSION: "5.0"

# CompanionKit is a versioned Swift package (github.com/DarkStarDS9/CompanionKit); its major
# version tracks the protocol version it implements. Package.resolved is what now records which
# protocol revision this app was built against — bump the pin deliberately.
packages:
  CompanionKit:
    url: https://github.com/DarkStarDS9/CompanionKit.git
    from: 12.0.0

targets:
  Snap2Ink:
    type: application
    platform: iOS
    sources:
      - path: Snap2Ink
        excludes:
          - "Configs/**"
    configFiles:
      Debug: Snap2Ink/Configs/Debug.xcconfig
      Release: Snap2Ink/Configs/Release.xcconfig
    dependencies:
      - package: CompanionKit
        product: CompanionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snap2ink.camera
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM is intentionally not set here -- it's personal to whichever Apple
        # Developer account is building. It comes from Snap2Ink/Configs/Local.xcconfig, a
        # gitignored file each contributor creates once; see Snap2Ink/Configs/Local.xcconfig.example
        # and README.md's "Building" section for how to find your own team id and set it up.
        # Simulator builds ignore it entirely.
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: Snap2Ink/Info.plist
      properties:
        CFBundleDisplayName: Snap2Ink
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Snap2Ink uses the camera to take the photo it prints to your e-ink display."
        NSBluetoothAlwaysUsageDescription: "Snap2Ink connects to your XTEINK companion display to send it photos."
        UIBackgroundModes:
          - bluetooth-central

  Snap2InkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Snap2InkTests
    dependencies:
      - target: Snap2Ink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snap2ink.camera.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Snap2Ink:
    build:
      targets:
        Snap2Ink: all
        Snap2InkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Snap2InkTests
    archive:
      config: Release
